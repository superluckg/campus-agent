name: campus-agent

services:
  postgres:
    container_name: campus-agent-postgres
    image: pgvector/pgvector:pg16
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qust_campus_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qust_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - campus-agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-qust_campus_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - campus-agent-network
    restart: unless-stopped

  redis:
    container_name: campus-agent-redis
    image: redis:8.10.1
    pull_policy: never
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - campus-agent-network
    restart: unless-stopped

  ollama:
    container_name: campus-agent-ollama
    image: ollama/ollama:0.34.1
    pull_policy: never
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - campus-agent_ollama:/root/.ollama
    gpus: all
    networks:
      - campus-agent-network
    restart: unless-stopped

volumes:
  campus-agent_pgdata:
    name: campus-agent_pgdata
  campus-agent_ollama:
    name: campus-agent_ollama

networks:
  campus-agent-network:
    name: campus-agent-network
